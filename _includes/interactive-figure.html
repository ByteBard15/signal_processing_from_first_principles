<figure id="{{ include.id }}" class="simulation" data-experiment="{{ include.experiment }}" aria-labelledby="{{ include.id }}-title">
  <strong id="{{ include.id }}-title" class="figure-title">{{ include.title }}</strong>
  <p>{{ include.description }}</p>
  <div class="experiment-ui"></div>
  <noscript><p>This experiment needs JavaScript. The derivation and interpretation below remain readable.</p></noscript>
  <figcaption>{{ include.caption }}</figcaption>
</figure>
